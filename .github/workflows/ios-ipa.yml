name: iOS IPA Build

on:
  workflow_run:
    workflows: ["Android Build & Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: 拉取代码 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: 版本检测 Version Gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || 'push' }}
        run: |
          set -euo pipefail
          bash .github/scripts/resolve-version-gate.sh

      - name: 安装 JDK Setup Java
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 缓存 Kotlin/Native 工具链 Cache Kotlin/Native Toolchain
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ios-konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            ios-konan-${{ runner.os }}-${{ runner.arch }}-

      - name: 安装 Android SDK Setup Android SDK
        if: steps.gate.outputs.skip != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: 配置 Gradle Setup Gradle
        if: steps.gate.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: 检查 Xcode Check Xcode
        if: steps.gate.outputs.skip != 'true'
        run: bash .github/scripts/check-ios-toolchain.sh

      - name: 授权脚本 Grant Permission
        if: steps.gate.outputs.skip != 'true'
        run: chmod +x gradlew .github/scripts/*.sh

      - name: 验证 iOS 图标资源 Verify iOS App Icon
        if: steps.gate.outputs.skip != 'true'
        run: bash .github/scripts/test-ios-icon-assets.sh

      - name: 验证 iOS 原生文案 Verify iOS Native Text
        if: steps.gate.outputs.skip != 'true'
        run: bash .github/scripts/test-ios-native-text.sh

      - name: 验证 iOS 字符串回退 Verify iOS String Fallback
        if: steps.gate.outputs.skip != 'true'
        run: bash .github/scripts/test-ios-string-fallback.sh

      - name: 验证版本转换 Version Mapping Test
        if: steps.gate.outputs.skip != 'true'
        run: bash .github/scripts/test-version-resolution.sh

      - name: 构建未签名 IPA Build Unsigned IPA
        id: build
        if: steps.gate.outputs.skip != 'true'
        env:
          CHANNEL: ${{ steps.gate.outputs.channel }}
          FULL_NAME: ${{ steps.gate.outputs.full_name }}
          IOS_VERSION: ${{ steps.gate.outputs.ios_version }}
          VERSION_CODE: ${{ steps.gate.outputs.code }}
        run: |
          set -euo pipefail

          if [[ "$CHANNEL" == "stable" ]]; then
            export XCODE_CONFIGURATION=Release
            export OUTPUT_NAME="EasyOpen-iOS-release-v${FULL_NAME}-${VERSION_CODE}.ipa"
          else
            export XCODE_CONFIGURATION=Debug
            export OUTPUT_NAME="EasyOpen-iOS-debug-v${FULL_NAME}-${VERSION_CODE}.ipa"
          fi

          .github/scripts/build-unsigned-ipa.sh

      - name: 写入版本元数据 Write Version Metadata
        if: steps.gate.outputs.skip != 'true'
        env:
          FULL_NAME: ${{ steps.gate.outputs.full_name }}
          IOS_VERSION: ${{ steps.gate.outputs.ios_version }}
          VERSION_CODE: ${{ steps.gate.outputs.code }}
          CHANNEL: ${{ steps.gate.outputs.channel }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          IPA_CONFIGURATION: ${{ steps.build.outputs.configuration }}
        run: |
          set -euo pipefail
          {
            printf 'android_display_version=%s\n' "$FULL_NAME"
            printf 'ios_bundle_short_version=%s\n' "$IOS_VERSION"
            printf 'ios_bundle_version=%s\n' "$VERSION_CODE"
            printf 'channel=%s\n' "$CHANNEL"
            printf 'configuration=%s\n' "$IPA_CONFIGURATION"
            printf 'unsigned=true\n'
            printf 'commit=%s\n' "$COMMIT_SHA"
          } > EasyOpen-iOS-build-metadata.txt

      - name: 上传 IPA 构建产物 Upload IPA Artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: EasyOpen-iOS-${{ steps.build.outputs.configuration }}-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}
          path: |
            ${{ steps.build.outputs.ipa_name }}
            ${{ steps.build.outputs.inspection_name }}
            EasyOpen-iOS-build-metadata.txt
          if-no-files-found: error
          retention-days: 14

      - name: 上传 IPA 到 GitHub Release 或 Pre-release Upload IPA To Release
        if: steps.gate.outputs.skip != 'true' && (steps.gate.outputs.channel == 'stable' || steps.gate.outputs.channel == 'beta')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.gate.outputs.full_name }}
          prerelease: ${{ steps.gate.outputs.channel == 'beta' }}
          draft: false
          generate_release_notes: false
          files: ${{ steps.build.outputs.ipa_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 dSYM 诊断符号 Upload dSYM Symbols
        if: steps.gate.outputs.skip != 'true' && steps.build.outputs.dsym_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: EasyOpen-iOS-${{ steps.build.outputs.configuration }}-v${{ steps.gate.outputs.full_name }}-${{ steps.gate.outputs.code }}-dSYM
          path: ${{ steps.build.outputs.dsym_name }}
          if-no-files-found: error
          retention-days: 14
